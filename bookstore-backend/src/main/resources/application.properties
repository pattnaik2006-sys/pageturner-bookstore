spring.application.name=bookstore-backend

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=barsha06
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Server =====
server.port=8080

# ===== JWT =====
# 256-bit+ secret, change in production and load from env var instead
jwt.secret=ThisIsADemoSecretKeyForBookstoreJWTAuthPleaseChangeInProd123456
jwt.expiration-ms=86400000

# ===== CORS (frontend dev server) =====
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
